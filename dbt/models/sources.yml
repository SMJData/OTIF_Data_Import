version: 2

sources:
  - name: export_orders
    schema: public
    description: "Export order data from Epicor OData BAQs. Export scope is defined in the BAQs."
    tables:
      - name: ontime_delivery
        description: "OntimeDelivery: OTIF tracking for export orders (Late, Early, Ontime)."
      - name: supply_chain
        description: "SupplyChain: export order tracking (Ready to Invoice, All Orders, Cancelled Orders, Invoiced Orders, Shipped Orders but not invoiced, Open Orders)."
      - name: z_so02_sc
        description: "z_SO02-SC: week-wise export sales orders by part, description, brand, pack size, and case configuration."
